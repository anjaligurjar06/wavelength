[project]
name = "api"
version = "0.1.0"
description = "Wavelength FastAPI gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "pydantic-settings>=2.6",
    "shared",
    "music-ingestion",
    "matching",
    "compatibility-engine",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
shared = { workspace = true }
music-ingestion = { workspace = true }
matching = { workspace = true }
compatibility-engine = { workspace = true }
